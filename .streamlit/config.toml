[theme]
primaryColor = "#0066cc"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "info"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 200
enableXsrfProtection = true
headless = true

[ui]
hideTopBar = false
hideFooterAndToolbar = false
widgetAlignment = "center"
